<p class="text-body-md font-body-md text-on-surface-variant">Enter your details to get started with Finash.</p>

<form class="space-y-stack-md">
<div>
<label class="block text-label-md font-label-md text-on-surface mb-base" for="fullName">Full Name</label>

</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-stack-md">
<div>
<label class="block text-label-md font-label-md text-on-surface mb-base" for="email">Email Address</label>
<input class="w-full h-12 px-4 rounded-lg bg-surface-container-low border border-outline-variant focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all outline-none text-body-md font-body-md text-on-surface placeholder:text-on-surface-variant/50" id="email" placeholder="jane@example.com" type="email"/>
</div>
<div>
<label class="block text-label-md font-label-md text-on-surface mb-base" for="phone">Phone Number</label>
<input class="w-full h-12 px-4 rounded-lg bg-surface-container-low border border-outline-variant focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all outline-none text-body-md font-body-md text-on-surface placeholder:text-on-surface-variant/50" id="phone" placeholder="+1 (555) 000-0000" type="tel"/>
</div>

<div>

</div>
<div>
<label class="block text-label-md font-label-md text-on-surface mb-base" for="confirmPassword">Confirm Password</label>
<input class="w-full h-12 px-4 rounded-lg bg-surface-container-low border border-outline-variant focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all outline-none text-body-md font-body-md text-on-surface placeholder:text-on-surface-variant/50" id="confirmPassword" placeholder="••••••••" type="password"/>
